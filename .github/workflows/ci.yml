name: CI / Build & Typecheck

on:
  push:
    branches: [ "main", "test" ]
  pull_request:
    branches: [ "main", "test" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Production build check
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://www.tecunique.com
          MONGODB_URI: mongodb+srv://dummy:dummy@cluster.mongodb.net/tecunique?appName=ci-build
          RESEND_API_KEY: re_dummy_key_for_build_validation
          ADMIN_JWT_SECRET: dummy_secret_key_for_ci_build_validation_123456789
